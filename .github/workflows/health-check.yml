name: Periodic health check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployed application
        uses: jtalk/url-health-check-action@v5
        with:
          url: https://fs-pokedex-kux0.onrender.com/this-route-should-not-exist
          max-attempts: 3
          retry-delay: 10s
